name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-and-build:
    name: Analyze & Debug APK Build
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 가져오기 (Checkout)
        uses: actions/checkout@v4

      - name: 2. Java 17 세팅 (Android Gradle 빌드용)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Flutter SDK 세팅
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 4. 패키지 설치 및 다국어 파일 생성
        run: |
          flutter pub get
          flutter gen-l10n

      - name: 5. 정적 분석 (Flutter Analyze - 에러/경고만 차단)
        run: flutter analyze --no-fatal-infos

      - name: 6. Android Debug APK 빌드
        run: flutter build apk --debug

      - name: 7. Debug APK 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
